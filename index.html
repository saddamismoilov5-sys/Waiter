<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Заказы официанта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F5F7;--card:#fff;--txt:#1D1D1F;--sec:#6E6E73;--line:rgba(0,0,0,.08);--acc:#0071E3;--grn:#15803D;--amb:#B45309;--seg:rgba(118,118,128,.12);--segon:#fff;--segsh:0 1px 3px rgba(0,0,0,.12);--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);--nav:rgba(250,250,252,.92);--pill:#ECECF0;--bar:#D2D2D7;--red:#D70015;--redbg:#FDE8EA;--purp:#6B3FA0;--purpbg:#EEE5FA;--grnbg:#E3F5E8;--ambbg:#FFF4E0;--outl:rgba(0,0,0,.12);--free:#86868B;--dg:#34C759;--da:#F59E0B;--ctl:#fff}
[data-theme=dark]{--bg:#000;--card:#1C1C1E;--txt:#F5F5F7;--sec:#8E8E93;--line:rgba(255,255,255,.1);--acc:#0A84FF;--grn:#30D158;--amb:#FF9F0A;--seg:rgba(118,118,128,.24);--segon:#48484A;--segsh:0 1px 3px rgba(0,0,0,.4);--sh:none;--nav:rgba(22,22,24,.94);--pill:#111113;--bar:#3A3A3C;--red:#FF453A;--redbg:rgba(255,69,58,.14);--purp:#C9A8FF;--purpbg:rgba(175,130,255,.18);--grnbg:rgba(48,209,88,.16);--ambbg:rgba(255,159,10,.14);--outl:rgba(255,255,255,.16);--free:#6E6E73;--dg:#30D158;--da:#FF9F0A;--ctl:#2C2C2E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 20px 24px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.sec{color:var(--sec)}
.small{font-size:13px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hd .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.live{display:flex;align-items:center;gap:6px;padding:0;background:none;border:0;font-size:13px;font-weight:500;color:var(--grn)}
.live i{width:8px;height:8px;border-radius:4px;background:var(--dg)}
.round{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;flex:none}
.card{background:var(--card);border-radius:22px;padding:18px 20px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px}
.row .k{color:var(--sec)}
.big{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.big b{font-weight:inherit}
.big small,.hero small{font-size:15px;font-weight:500;color:var(--sec);letter-spacing:0}
.hero{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.hero small{font-size:17px}
.acc{color:var(--acc)}
.sepl{border-top:1px solid var(--line);padding-top:12px}
.seg{display:flex;padding:2px;border-radius:10px;background:var(--seg);flex:none}
.seg button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:500}
.seg button.on{background:var(--segon);box-shadow:var(--segsh);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:0 20px;flex:none}
.chip{flex:none;height:36px;padding:0 14px;border:0;border-radius:18px;background:var(--seg);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:0;text-align:left;border-radius:20px;padding:13px 14px;height:96px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile.free{background:transparent;border:1px solid var(--outl);box-shadow:none}
.tile.closed{background:var(--pill);box-shadow:none}
.tile .n{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tile .n.s{font-size:20px;line-height:28px}
.tile.free .n{color:var(--free)}
.tile.closed .n,.tile.closed .p{color:var(--sec)}
.tile .top{display:flex;align-items:center;justify-content:space-between}
.tile .top i{width:8px;height:8px;border-radius:4px}
.tile .st{font-size:12px;font-weight:500}
.tile .p{font-size:15px;font-weight:600}
.tile .bt{display:flex;flex-direction:column;gap:2px}
.nav{height:84px;padding:8px 12px 22px;display:flex;justify-content:space-around;background:var(--nav);border-top:1px solid var(--line);flex:none;backdrop-filter:blur(20px)}
.nav button{width:72px;padding:4px 0 0;background:none;border:0;font-size:11px;font-weight:500;color:var(--sec);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button.on{color:var(--acc);font-weight:600}
.btn{height:54px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:17px;font-weight:600;width:100%}
.btn:disabled{opacity:.4}
.btn.pu{background:#8B5CF6}
.btn.ghost{background:var(--seg);color:var(--txt);font-size:16px;height:48px}
.btn.red{background:var(--redbg);color:var(--red);font-size:16px;height:48px}
.link{height:44px;border:0;background:transparent;color:var(--acc);font-size:15px;font-weight:500}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.topbar .back{height:36px;padding:0;background:none;border:0;font-size:16px;color:var(--acc)}
.topbar .t{font-size:17px;font-weight:600}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600}
.pill.wait{background:var(--ambbg);color:var(--amb)}.pill.ok{background:var(--grnbg);color:var(--grn)}.pill.new{background:var(--seg);color:var(--sec)}
.tag{margin-left:6px;height:18px;padding:0 7px;border-radius:9px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;vertical-align:1px}
.tag.chef{background:var(--purpbg);color:var(--purp)}.tag.disc{background:var(--grnbg);color:var(--grn)}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);border:1.5px solid transparent;color:var(--sec)}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;color:var(--txt)}
.search button{border:0;background:none;color:var(--acc);font-size:14px;padding:0}
.search .kb{flex:none;height:28px;min-width:44px;padding:0 10px;border-radius:14px;background:var(--seg);color:var(--txt);font-size:13px;font-weight:600}
.search .kb.on{background:var(--acc);color:#fff}
.panel{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:6px 18px}
.panel .hdr{font-size:12px;font-weight:600;color:var(--sec);padding:12px 0 6px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.panel .hdr+.item,.panel>.item:first-child{border-top:0}
.item .nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .nm b{font-size:16px;font-weight:500}
.item .nm span{font-size:12px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pr{font-size:16px;font-weight:600;flex:none}
.item.stop .nm b,.item.stop .pr{color:var(--sec)}
mark{background:var(--ambbg);color:inherit;border-radius:3px}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .ck{width:26px;height:26px;border-radius:13px;border:1.8px solid var(--bar);background:none;flex:none;display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
.line.done .ck{background:var(--bar);border-color:var(--bar)}
.line .body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.line .body b{font-size:16px;font-weight:500}
.line .body span{font-size:13px;color:var(--sec)}
.line .sm{font-size:16px;font-weight:600}
.line.done .body b,.line.done .sm{color:var(--sec)}
.bottom{flex:none;padding:12px 20px max(20px,env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;backdrop-filter:blur(20px)}
.bottom .t{display:flex;flex-direction:column;gap:2px}
.bottom .t b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bottom .btn{width:auto;padding:0 22px;height:48px;font-size:16px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--bar);position:relative;border:0;padding:0;flex:none;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:#34C759}.sw.on i{left:22px}
.banner{border-radius:16px;padding:12px 16px;font-size:13px;line-height:1.4;font-weight:500}
.banner.amb{background:var(--ambbg);color:var(--amb)}.banner.pu{background:var(--purpbg);color:var(--purp)}
#sheet{position:fixed;inset:0;display:none;z-index:20}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#sheet .box{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;max-height:88dvh;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.grab{align-self:center;width:36px;height:5px;border-radius:3px;background:var(--bar);flex:none}
.act{display:flex;align-items:center;gap:14px;padding:0 16px;height:60px;border:0;border-radius:16px;background:var(--seg);text-align:left;width:100%}
.act b{font-size:16px;font-weight:600;display:block}.act span{font-size:12px;color:var(--sec);display:block}
.act.red{background:var(--redbg);color:var(--red)}
.qty{display:flex;align-items:center;gap:4px;padding:4px;border-radius:22px;background:var(--seg)}
.qty button{width:36px;height:36px;border:0;border-radius:18px;background:var(--ctl);font-size:20px}
.qty span{width:32px;text-align:center;font-size:17px;font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600;color:var(--sec);padding-left:4px}
.fld input,.fld textarea,.fld select{border:0;border-radius:14px;background:var(--seg);padding:12px 14px;font-size:16px;outline:0;width:100%;resize:none}
.fld input:focus,.fld textarea:focus{box-shadow:0 0 0 1.5px var(--acc)}
.x{border:0;background:none;color:var(--sec);padding:0 0 0 6px;font-size:16px}
.cm{display:inline-flex;align-items:center;height:36px;padding:0 6px 0 14px;border-radius:18px;background:var(--seg);font-size:14px;font-weight:500}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:30;max-width:440px;width:calc(100% - 40px);background:rgba(40,40,44,.96);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;display:none;align-items:center;justify-content:space-between;gap:12px}
#toast.on{display:flex}
#toast button{border:0;background:none;color:#64B5FF;font-weight:600;font-size:14px;padding:0}
.bars{display:flex;align-items:flex-end;gap:4px;overflow-x:auto}
.bars>div{flex:1;min-width:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:130px}
.bars i{width:100%;max-width:18px;border-radius:6px;background:var(--bar)}
.bars span{font-size:10px;color:var(--sec)}
.bars .cur i{background:var(--acc)}.bars .cur span{color:var(--acc);font-weight:600}
.three{display:flex;gap:10px}
.three>div{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}
.three small{font-size:12px;color:var(--sec)}.three b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.dates{display:flex;gap:10px;align-items:center}
.dates label{flex:1;background:var(--card);border-radius:14px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--sec)}
.dates input{border:0;background:transparent;font-size:15px;font-weight:500;outline:0;padding:0;color:var(--txt);width:100%}
.empty{text-align:center;color:var(--sec);font-size:14px;padding:26px 10px}
.ico{width:64px;height:64px;border-radius:32px;background:var(--seg);display:flex;align-items:center;justify-content:center;color:var(--sec)}
.dim{opacity:.45}
.dis{opacity:.4;pointer-events:none}
.sub{display:flex;justify-content:space-between;align-items:center;gap:10px}
.editrow{display:flex;gap:8px}
.editrow .btn{height:44px;font-size:14px;border-radius:14px}
</style>
</head>

const L2C={a:'а',b:'б',c:'к',d:'д',e:'е',f:'ф',g:'г',h:'х',i:'и',j:'дж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'к',r:'р',s:'с',t:'т',u:'у',v:'в',w:'в',x:'кс',y:'и',z:'з'};
const tr=s=>s.replace(/[a-z]/g,c=>L2C[c]||c);
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
function tokens(q){return norm(q).split(/\s+/).filter(Boolean)}
function matchItem(it,cat,toks){const hay=norm(it.name+' '+cat.name+' '+(it.desc||''));const hay2=tr(hay);const p=String(it.price);
 return toks.every(t=>/^\d+$/.test(t)?(hay.includes(t)||p.startsWith(t)):(hay.includes(t)||hay2.includes(t)||hay.includes(tr(t))))}
function find(q,side){const toks=tokens(q),r=[];S.menu.cats.forEach(c=>{if(side&&(c.bar?'bar':'kitchen')!==side)return;c.items.forEach(it=>{if(matchItem(it,c,toks))r.push({it,c})})});return r}
function hl(text,toks){const real=toks.filter(t=>t.length>0).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));if(!real.length)return esc(text);const re=new RegExp('('+real.join('|')+')','gi');return text.split(re).map((p,i)=>i%2?'<mark>'+esc(p)+'</mark>':esc(p)).join('')}
const findItem=id=>{for(const c of S.menu.cats){const it=c.items.find(i=>i.id===id);if(it)return{it,c}}return null};

 const hrs=th/3600000;
 return `<div class="sec" style="font-size:15px;padding-left:4px">${cap(monthName())} · ${rows.length} ${rows.length===1?'смена':'смен'} · ${dur(th)}</div>

 <div class="card" style="padding:16px 18px 12px;gap:12px"><div class="sub"><span class="small sec" style="font-weight:600">Зарплата по сменам</span><span class="sec" style="font-size:12px">сом</span></div><div class="bars">${chart}</div></div>
 <div class="panel">${[...rows].reverse().map(r=>`<div class="item" style="cursor:default"><span class="nm"><b>${dd(r.s.start,{weekday:'short',day:'numeric',month:'long'})}${!r.s.end?' · идёт':''}</b><span>${tm(r.s.start)}–${r.s.end?tm(r.s.end):'сейчас'} · ${dur(r.h)} · касса ${fmt(r.st.cash)}</span></span><span class="pr acc">${fmt(r.st.salary)}</span></div>`).join('')}</div>`}

/* ----- archive ----- */
function archiveScreen(){
 const list=[...S.archive].sort((a,b)=>b.closedAt-a.closedAt);
 const groups={};list.forEach(o=>{(groups[dayKey(o.closedAt)]=groups[dayKey(o.closedAt)]||[]).push(o)});
 const today=dayKey(Date.now()),yest=dayKey(Date.now()-864e5);
 const html=Object.keys(groups).map(k=>{const g=groups[k];const sum=g.filter(o=>!o.chef).reduce((a,o)=>a+o.paid,0);const nm=k===today?'Сегодня':k===yest?'Вчера':dd(g[0].closedAt,{weekday:'short'});
 return `<div class="panel"><div class="hdr sub"><span>${nm}, ${dd(g[0].closedAt,{day:'numeric',month:'long'}).toLowerCase()}</span><b style="font-size:14px;color:var(--txt)">${fmt(sum)} сом</b></div>${g.map(o=>`<button class="item" data-act="arcOrder" data-v="${o.id}"><span class="nm"><b>Стол ${esc(o.table)} <span class="sec small" style="font-weight:400">· ${tm(o.closedAt)}</span>${o.chef?'<span class="tag chef">Шеф</span>':o.discount>0?`<span class="tag disc">−${o.discPct?o.discPct+'%':fmt(o.discount)}</span>`:''}</b><span>${o.lines.length} ${o.lines.length===1?'позиция':'поз.'}</span></span><span class="pr" style="${o.chef?'color:var(--sec);text-decoration:line-through':''}">${fmt(o.chef?o.total:o.paid)}</span></button>`).join('')}</div>`}).join('');
 return `<div class="scroll"><div class="hd"><div class="l"><span class="small sec" style="font-weight:500">Закрытые заказы</span><h1>Архив</h1></div></div>${html||'<div class="empty">Пока нет закрытых заказов</div>'}</div>`}

function tabScreen(){return ui.tab==='tables'?tablesScreen():ui.tab==='menu'?menuScreen():ui.tab==='cash'?cashScreen():archiveScreen()}

function render(){
 const a=$('#app');const sc=a.querySelector('.scroll');const top=sc?sc.scrollTop:0;const ch=[...a.querySelectorAll('.chips')].map(c=>c.scrollLeft);
 let h;
 if(ui.screen==='order')h=orderScreen();else if(ui.screen==='checkout')h=checkoutScreen();else if(ui.screen==='endshift')h=endShiftScreen();else h=tabScreen()+nav();
 a.innerHTML=h;
 const s2=a.querySelector('.scroll');if(s2)s2.scrollTop=top;a.querySelectorAll('.chips').forEach((c,i)=>{if(ch[i])c.scrollLeft=ch[i]});
 document.documentElement.dataset.theme=S.theme;
 const act=a.querySelector('.chips .chip.on');if(act&&!ch.some(Boolean)){act.scrollIntoView({inline:'center',block:'nearest'})}
}

/* ---------- actions ---------- */
function addLine(itemId){
 const f=findItem(itemId);if(!f)return;const{it}=f;
 if(it.stop){toast('«'+it.name+'» в стопе');return}
 let o=S.orders[ui.table];if(!o)o=S.orders[ui.table]={id:uid(),table:ui.table,openedAt:Date.now(),lines:[]};
 let l=o.lines.find(x=>x.itemId===itemId&&!x.comment&&!x.served);
 if(l)l.qty++;else{l={id:uid(),itemId,name:it.name,price:it.price,qty:1,comment:'',served:false};o.lines.push(l)}
 ui.last={line:l.id};save();toast('Добавлено: '+it.name,true);refreshOrder()}
function act(a,el){
 const v=el.dataset.v;
 switch(a){
 case 'numkb':{ui.num=!ui.num;document.querySelectorAll('.search input').forEach(i=>i.setAttribute('inputmode',ui.num?'numeric':'text'));document.querySelectorAll('.kb').forEach(b=>{b.classList.toggle('on',ui.num);b.textContent=ui.num?'abc':'123'});const i=$('#q')||$('#mq');if(i){i.blur();setTimeout(()=>i.focus(),30)}break}
 case 'theme':S.theme=S.theme==='dark'?'light':'dark';save();render();break;
 case 'tab':ui.tab=v;render();break;
 case 'zone':ui.zone=v;render();break;
 case 'openShift':S.shift={start:Date.now()};save();render();break;
 case 'endShift':ui.screen='endshift';render();break;
 case 'backMain':ui.screen='main';render();break;
 case 'closeShift':S.shifts.push({start:S.shift.start,end:Date.now()});S.shift=null;save();ui.screen='main';ui.tab='tables';render();break;
 case 'openTable':ui.table=v;ui.q='';ui.ocat=null;ui.screen='order';render();break;
 case 'back':{const o=S.orders[ui.table];if(o&&!o.lines.length){delete S.orders[ui.table];save()}ui.screen='main';ui.q='';ui.ocat=null;render();break}
 case 'clearq':ui.q='';{const i=$('#q');if(i)i.value=''}refreshOrder();break;
 case 'ocat':ui.ocat=ui.ocat===v?null:v;refreshOrder();break;
 case 'add':addLine(v);break;
 case 'undo':{const o=S.orders[ui.table];if(o&&ui.last){const i=o.lines.findIndex(l=>l.id===ui.last.line);if(i>=0){if(o.lines[i].qty>1)o.lines[i].qty--;else o.lines.splice(i,1);if(!o.lines.length)delete S.orders[ui.table];save()}}$('#toast').classList.remove('on');if(ui.screen==='order')refreshOrder();break}
 case 'serve':{const l=S.orders[ui.table].lines.find(x=>x.id===v);l.served=!l.served;save();refreshOrder();break}
 case 'serveAll':S.orders[ui.table].lines.forEach(l=>l.served=true);save();refreshOrder();break;
 case 'editLine':lineSheet(v);break;
 case 'qty':{const o=S.orders[ui.table],l=o.lines.find(x=>x.id===sheetLine);const n=l.qty+parseInt(v);if(n>=1){l.qty=n;save();$('#qv').textContent=n;refreshOrder()}break}
 case 'qc':{const l=S.orders[ui.table].lines.find(x=>x.id===sheetLine);const c=S.quick[+v];const i=$('#lc');const cur=i.value.trim();if(!cur.split(/,\s*/).includes(c)){i.value=cur?cur+', '+c:c}l.comment=i.value.trim();save();refreshOrder();break}
 case 'noStock':{const o=S.orders[ui.table],i=o.lines.findIndex(x=>x.id===sheetLine);const l=o.lines[i];const f=findItem(l.itemId);if(f)f.it.stop=true;o.lines.splice(i,1);if(!o.lines.length)delete S.orders[ui.table];save();closeSheet();toast('«'+l.name+'» убрано и добавлено в стоп-лист');refreshOrder();break}
 case 'delLine':{const o=S.orders[ui.table],i=o.lines.findIndex(x=>x.id===sheetLine);o.lines.splice(i,1);if(!o.lines.length)delete S.orders[ui.table];save();closeSheet();refreshOrder();break}
 case 'editQuick':quickSheet('backLine');break;
 case 'backLine':lineSheet(sheetLine);break;
 case 'editQuick2':quickSheet('settings');break;
 case 'qdel':S.quick.splice(+v,1);save();quickSheet(el.closest('.box').querySelector('.btn.ghost').dataset.act);break;
 case 'qadd':{const i=$('#qn');const t=i.value.trim();const back=el.parentElement.querySelector('.btn.ghost').dataset.act;if(t){S.quick.push(t);save()}quickSheet(back);break}
 case 'checkout':ui.disc={pct:0,custom:null};ui.chef=false;ui.customOn=false;ui.screen='checkout';render();break;
 case 'backOrder':ui.screen='order';render();break;
 case 'disc':ui.disc={pct:+v,custom:null};ui.customOn=false;render();break;
 case 'customDisc':ui.customOn=true;ui.disc={pct:0,custom:ui.disc.custom!=null?ui.disc.custom:0};render();{const i=$('#cdisc');if(i)i.focus()}break;
 case 'chef':ui.chef=!ui.chef;render();break;
 case 'pay':{const o=S.orders[ui.table];const total=orderSum(o);const ds=discSum(total);const pay=ui.chef?0:total-ds;
  S.archive.push({id:uid(),table:ui.table,lines:o.lines,total,discount:ui.chef?0:ds,discPct:ui.chef||ui.disc.custom!=null?0:ui.disc.pct,paid:pay,chef:ui.chef,closedAt:Date.now(),shiftStart:S.shift?S.shift.start:0,openedAt:o.openedAt});
  delete S.orders[ui.table];save();ui.screen='main';ui.tab='tables';render();toast(ui.chef?'Стол закрыт · гости шефа':'Стол закрыт · '+fmt(pay)+' сом');break}
 case 'side':ui.side=v;ui.cat=null;render();break;
 case 'mcat':ui.cat=v;render();break;
 case 'stop':{const f=findItem(v);f.it.stop=!f.it.stop;save();render();break}
 case 'menuEdit':ui.menuEdit=!ui.menuEdit;render();break;
 case 'addItem':itemSheet(null,ui.cat);break;
 case 'editItem':itemSheet(v);break;
 case 'addCat':catSheet(null);break;
 case 'editCat':catSheet(v);break;
 case 'saveItem':{const n=$('#in').value.trim(),p=parseInt($('#ip').value),d=$('#id').value.trim(),cid=$('#ic').value;if(!n||isNaN(p)||p<0){toast('Введи название и цену');break}
  if(v){const f=findItem(v);f.it.name=n;f.it.price=p;f.it.desc=d;if(f.c.id!==cid){f.c.items.splice(f.c.items.indexOf(f.it),1);S.menu.cats.find(c=>c.id===cid).items.push(f.it)}}
  else S.menu.cats.find(c=>c.id===cid).items.push({id:'m'+uid(),name:n,price:p,desc:d,stop:false});
  const tc=S.menu.cats.find(c=>c.id===cid);ui.side=tc.bar?'bar':'kitchen';ui.cat=cid;save();closeSheet();render();break}
 case 'delItem':armed(el,()=>{const f=findItem(v);f.c.items.splice(f.c.items.indexOf(f.it),1);save();closeSheet();render()});break;
 case 'saveCat':{const n=$('#cn').value.trim();if(!n){toast('Введи название');break}const bar=$('#cs').value==='bar';
  if(v){const c=S.menu.cats.find(c=>c.id===v);c.name=n;c.bar=bar}else{const c={id:'c'+uid(),name:n,bar,items:[]};S.menu.cats.push(c);ui.cat=c.id}ui.side=bar?'bar':'kitchen';save();closeSheet();render();break}
 case 'delCat':armed(el,()=>{S.menu.cats=S.menu.cats.filter(c=>c.id!==v);ui.cat=null;save();closeSheet();render()});break;
 case 'cview':ui.cashView=v;render();break;
 case 'period':ui.period=v;render();break;
 case 'arcOrder':arcSheet(v);break;
 case 'settings':settingsSheet();break;
 case 'zones':zonesSheet();break;
 case 'tadd':{const i=document.querySelector('.zin[data-z="'+v+'"]');const t=i.value.trim();const z=S.zones.find(z=>z.id===v);if(t&&!S.zones.some(z=>z.tables.includes(t))){z.tables.push(t);save();zonesSheet()}else if(t)toast('Такой стол уже есть');break}
 case 'tdel':{const z=S.zones.find(z=>z.id===el.dataset.z);const t=z.tables[+v];if(S.orders[t]&&S.orders[t].lines.length){toast('На столе есть открытый заказ');break}z.tables.splice(+v,1);save();zonesSheet();break}
 case 'zadd':{const t=$('#zn').value.trim();if(t){S.zones.push({id:'z'+uid(),name:t,tables:[]});save();zonesSheet()}break}
 case 'backup':backupSheet();break;
 case 'bkcopy':{const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано'),()=>{document.execCommand('copy');toast('Скопировано')})}catch(e){document.execCommand('copy');toast('Скопировано')}break}
 case 'bkrestore':{try{const c=JSON.parse($('#bk').value);if(!c.menu||!c.zones)throw 0;S=Object.assign(defState(),c);save();closeSheet();render();toast('Данные восстановлены')}catch(e){toast('Не удалось прочитать копию')}break}
 case 'closeSheet':closeSheet();break;
 }
}

 else if(t.id==='cdisc'){const n=parseInt(t.value);ui.disc={pct:0,custom:isNaN(n)?0:Math.max(0,n)};const o=S.orders[ui.table];const total=orderSum(o);const pay=total-discSum(total);const b=document.querySelector('.btn[data-act="pay"]');if(b)b.textContent='Закрыть стол · '+fmt(pay)+' сом';const k=document.querySelectorAll('.card')[0];if(k){render();const i=$('#cdisc');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.in){ui[t.dataset.in]=t.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const t=e.target;if(t.id==='qn')act('qadd',document.querySelector('[data-act=qadd]'));else if(t.classList.contains('zin'))act('tadd',{dataset:{v:t.dataset.z}});else if(t.id==='zn')act('zadd',{dataset:{}});else t.blur()}});
setInterval(()=>{if(S.shift&&(ui.screen==='endshift'||(ui.screen==='main'&&ui.tab==='tables'))&&!$('#sheet').classList.contains('open')&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render()},60000);
document.documentElement.dataset.theme=S.theme;
render();cloudLoad();
</script>
</body>
</html>
